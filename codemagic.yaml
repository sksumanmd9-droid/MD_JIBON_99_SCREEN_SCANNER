workflows:
  android-apk:
    name: MD JIBON 99 Android APK
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Install Gradle 8.7
        script: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME/gradle
          export PATH="$HOME/gradle/gradle-8.7/bin:$PATH"
          gradle --version

      - name: Build Debug APK
        script: |
          export PATH="$HOME/gradle/gradle-8.7/bin:$PATH"
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
