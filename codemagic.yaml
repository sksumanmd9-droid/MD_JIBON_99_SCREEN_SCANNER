workflows:
  android-apk:
    name: MD JIBON 99 Android APK
    max_build_duration: 30

    environment:
      groups:
        - google_play
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
